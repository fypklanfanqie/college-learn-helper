# Project-wide Gradle settings.
# 注意：C 盘满会导致页面文件无法扩展、JVM 内存映射失败，故 heap 收敛到 2g（用户清理 C 盘后可调回 4g）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# 网络：VPN 为 TUN 模式（透明代理），Gradle 直连即可；配置本地 7897 代理会导致 JVM TLS 握手被中断
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897
# JVM 走 IPv4，避免 AAAA 路径被重置导致 TLS 握手失败
systemProp.java.net.preferIPv4Stack=true

# 工程路径含中文（daxue学习），跳过 AGP 的非 ASCII 路径检查；如后续 aapt2/原生构建异常，再考虑迁移到纯 ASCII 路径
android.overridePathCheck=true

# 仓库重试（对抗偶发 TLS 握手中断）
systemProp.org.gradle.internal.repository.max.retries=7
systemProp.org.gradle.internal.repository.initial.connection.timeout=60000
